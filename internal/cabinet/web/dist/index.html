<!DOCTYPE html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0f1e" />
    <title>Кабинет</title>
    <link rel="icon" type="image/svg+xml" href="/cabinet/favicon.svg" />
    <link rel="manifest" href="/cabinet/api/public/pwa-manifest.webmanifest" />
    <!--
      Шрифты локальные: файлы в public/fonts, объявления в src/fonts.css.
      Google Fonts убран целиком. Раньше Inter и Manrope тянулись через @import
      внутри index.css, то есть браузер узнавал о них только после загрузки и
      разбора бандла стилей: HTML -> index-*.css -> fonts.googleapis.com ->
      fonts.gstatic.com. До конца этой цепочки заголовки рисовались системным
      шрифтом и потом подменялись — заметный рывок при каждом заходе. Плюс
      внешняя зависимость, ненадёжная в РФ (та же причина, по которой
      telegram-web-app.js грузится отложенно, см. комментарий ниже).

      Прогреваем то, что рисует первый экран: Inter 400 (основной текст) и
      Manrope 700 (заголовки, font-heading). Остальные начертания подтянутся
      из того же бандла стилей. Список файлов должен совпадать с src/fonts.css.
    -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/cabinet/fonts/inter-400-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/cabinet/fonts/inter-400-cyrillic.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/cabinet/fonts/manrope-700-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/cabinet/fonts/manrope-700-cyrillic.woff2" />
    <!-- telegram-web-app.js не подключаем здесь: синхронная загрузка с telegram.org блокирует первый рендер при блокировке (РФ). См. loadTelegramWebAppScriptIfNeeded в main.tsx. -->
    <script type="module" crossorigin src="/cabinet/assets/index-Bn0G99w1.js"></script>
    <link rel="modulepreload" crossorigin href="/cabinet/assets/router-DoSu5N_y.js">
    <link rel="modulepreload" crossorigin href="/cabinet/assets/query-COvk_SeJ.js">
    <link rel="stylesheet" crossorigin href="/cabinet/assets/index-dyPWJGe1.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
